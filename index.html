<title>프로젝트 일정 · 간트</title>
<style>
  :root{
    --paper:#F5F7FA; --surface:#FFFFFF; --ink:#1B2430; --muted:#64748B;
    --line:#E2E8F0; --line-strong:#CBD5E1; --accent:#0E7490; --today:#E4572E;
    --we:#F1F5F9; --we2:#F8FAFC; --soft:#EEF2F7; --soft2:#E2E8F0; --hover:#FBFCFE;
    --urgbg:#FCF3F0; --urgbg2:#FAECE7; --urgcard:#FDF8F6; --urgbd:#E8B8AC; --flash:#ECFEFF;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "Nanum Gothic Coding", monospace;
    --row-h: 42px; --left-w: 346px;
  }
  html[data-theme="dark"]{
    --paper:#12161B; --surface:#1A2027; --ink:#E6EAEF; --muted:#93A0AD;
    --line:#28313B; --line-strong:#3B4754; --accent:#3FB0CC; --today:#FF6B47;
    --we:#20272F; --we2:#171D24; --soft:#242D37; --soft2:#2E3945; --hover:#1F262E;
    --urgbg:#2E1B16; --urgbg2:#3A231C; --urgcard:#261A16; --urgbd:#5C352A; --flash:#123840;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden;
    padding-top:env(safe-area-inset-top)}

  /* ---------- top bar ---------- */
  header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);
    border-bottom:1px solid var(--line-strong);flex-wrap:wrap;flex:0 0 auto}
  header.top h1{font-size:15px;font-weight:650;letter-spacing:.2px;margin:0;white-space:nowrap}
  header.top h1 .dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);
    margin-right:8px;transform:translateY(-1px)}
  .spacer{flex:1}
  .group{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .group button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:13px;
    padding:7px 12px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
  .group button:last-child{border-right:0}
  .group button.on{background:var(--ink);color:var(--paper)}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;
    font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.today{color:var(--today);border-color:#F0C4B6}
  .hide{display:none !important}

  .stage{flex:1;overflow:auto;background:var(--surface);-webkit-overflow-scrolling:touch}

  /* ---------- gantt ---------- */
  .grid{position:relative;min-width:max-content}
  .head{display:flex;position:sticky;top:0;z-index:20}
  .head .corner{position:sticky;left:0;z-index:30;width:var(--left-w);flex:0 0 var(--left-w);
    background:var(--surface);border-bottom:1px solid var(--line-strong);border-right:1px solid var(--line-strong);
    display:flex;align-items:flex-end}

  .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.32);z-index:50;display:none}

  .sheet.open{transform:none}

  }

</style>

<body>

<script>
"use strict";
/* ==========================================================
   일정 · 간트 / 캘린더 / 목록   (단일 파일 · 외부 의존성 없음)
   ========================================================== */
const DAY=86400000;
const MONTHS=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const DOW=["일","월","화","수","목","금","토"];
const BARC=["#BC4A3C","#C7871B","#4E8A3C","#0F8A6E","#1C7C99","#2F63B4","#7A54C0","#B0468F","#5B6B7B","#8A5A44"];
const SWATCHES=["#BC4A3C","#C7871B","#4E8A3C","#0F8A6E","#1C7C99","#2F63B4","#7A54C0","#B0468F","#5B6B7B","#8A5A44"];
const ZOOM={day:{w:30,pad:3},week:{w:11,pad:7},month:{w:4.2,pad:16}};
const CAL_LANES=5, LANE_H=20, LANE_TOP=24;

let state={view:"gantt",zoom:"week",tasks:[],cal:null,calAll:false,leftW:346,hideDone:false,theme:"auto",gcol:[]};
const openWeeks=new Set();
let flashId=null;

/* ---- dates (local, no TZ drift) ---- */
function parseD(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function fmtD(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function shortD(s){const[,m,d]=s.split("-");return +m+"/"+ +d;}
function today0(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function daysBetween(a,b){return Math.round((b-a)/DAY);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---- encode / decode ----
   내보내기: 사람이 읽는 줄 단위 텍스트 (한 줄이 깨져도 나머지는 살아남음)
   불러오기: 새 텍스트 형식 + 예전 GANTT1 형식 + 순수 JSON 모두 허용 */
function pad2(n){return String(n).padStart(2,"0");}
function normD(s){
  const m=/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})$/.exec(String(s).trim());
  return m?m[1]+"-"+pad2(+m[2])+"-"+pad2(+m[3]):null;
}
function enc(o){
  const lines=["# 일정 데이터 · 이 줄 아래를 모두 복사해서 옮기세요",
               "# 작업명 | 시작 | 종료 | 진행% | 색상 | 긴급(!) | 그룹 | 반복(~종료일) | 시간 | 메모"];
  for(const t of o.tasks){
    lines.push([String(t.name||"").replace(/\|/g,"/").trim()||"이름 없음",
                t.start, t.end, (Math.max(0,Math.min(100,+t.progress||0)))+"%",
                t.color||"", t.urgent?"!":"",
                String(t.group||"").replace(/\|/g,"/").trim(),
                repToken(t),
                String(t.time||"").replace(/\|/g,"/").trim(),
                String(t.memo||"").replace(/\|/g,"/").replace(/\r?\n/g," ").trim()
               ].join(" | ").replace(/(\s*\|\s*)+$/,""));
  }
  return lines.join("\n");
}
function decLines(text){
  const out=[];
  for(const raw of String(text).split(/\r?\n/)){
    const line=raw.trim();
    if(!line||line.startsWith("#")) continue;
    const f=line.split("|").map(x=>x.trim());
    if(f.length<3) continue;
    const s=normD(f[1]), e=normD(f[2]);
    if(!s||!e) continue;
    const t={id:uid(),name:f[0]||"이름 없음",start:s,end:e,
             progress:Math.max(0,Math.min(100,parseInt(f[3],10)||0))};
    const col=(f[4]||"").trim();
    if(/^#[0-9a-fA-F]{6}$/.test(col)) t.color=col;
    if((f[5]||"").trim()==="!") t.urgent=true;
    const grp=(f[6]||"").trim(); if(grp) t.group=grp;
    const pr=parseRepToken(f[7]||"");
    if(pr){ t.repeat=pr.repeat; if(pr.until) t.until=pr.until; }
    const tm=(f[8]||"").trim(); if(tm) t.time=tm;
    const mm=(f[9]||"").trim(); if(mm) t.memo=mm;
    if(parseD(t.end)<parseD(t.start)) t.end=t.start;
    out.push(t);
  }
  return out;
}
function dec(text){
  const raw=String(text||"");
  const lines=decLines(raw);
  if(lines.length) return lines;                       // 새 텍스트 형식
  let t=raw.trim();
  const h=t.indexOf("#d="); if(h>=0)t=t.slice(h+3);
  if(t.startsWith("GANTT1:"))t=t.slice(7);
  t=t.replace(/[^A-Za-z0-9+/=]/g,"");                  // 예전 Base64 형식(오염 문자 제거)
  if(t){
    try{const o=JSON.parse(decodeURIComponent(escape(atob(t))));
      if(Array.isArray(o.tasks))return o.tasks;}catch(e){}
  }
  try{const o=JSON.parse(raw);                          // 순수 JSON
    if(Array.isArray(o.tasks))return o.tasks; if(Array.isArray(o))return o;}catch(e){}
  return null;
}

let _n=0; function uid(){return "t"+Date.now().toString(36)+(_n++);}
function colorOf(t,i){return t.color||BARC[i%BARC.length];}
function isDone(t){return !t.repeat && (+t.progress||0)>=100;}
function isUrgent(t){ // 수동 플래그 또는 자동 규칙(미완료 + 종료일 3일 이내/초과)
  if(t.repeat||isDone(t)) return false;
  if(t.urgent) return true;
  return daysBetween(today0(),parseD(t.end))<=3;
}
/* 반복 규칙(객체): {f:"W",d:[요일...],n:간격} | {f:"M",day:일} | {f:"MW",nth:1..5,d:요일}
   t.until = 반복 종료일("" 또는 미설정 = 무기한). 구형 문자열 "W1"/"M25"는 자동 변환. */
const NTH=["첫째","둘째","셋째","넷째","다섯째"];
function normRepeat(t){
  if(!t.repeat) return null;
  if(typeof t.repeat==="object") return t.repeat;
  let m=/^W(\d)$/.exec(t.repeat);
  if(m){ t.repeat={f:"W",d:[+m[1]%7],n:1}; return t.repeat; }
  m=/^M(\d{1,2})$/.exec(t.repeat);
  if(m){ t.repeat={f:"M",day:+m[1]}; return t.repeat; }
  delete t.repeat; return null;
}
function occurrences(t,a,b){
  const out=[], r=normRepeat(t); if(!r) return out;
  const st=parseD(t.start);
  let lo=a<st?st:a, hi=b;
  if(t.until){ const u=parseD(t.until); if(u<hi) hi=u; }
  if(lo>hi) return out;
  const ref=addDays(st,-st.getDay());              // 격주 기준: 시작일이 속한 주
  let guard=0;
  for(let d=new Date(lo);d<=hi&&out.length<200&&guard<800;d=addDays(d,1),guard++){
    const dow=d.getDay();
    if(r.f==="W"){
      if(!r.d.includes(dow)) continue;
      const wk=Math.floor(daysBetween(ref,addDays(d,-dow))/7);
      if(wk%(r.n||1)!==0) continue;
      out.push(new Date(d));
    }else if(r.f==="M"){
      if(d.getDate()===r.day) out.push(new Date(d));
    }else{
      if(dow===r.d && Math.ceil(d.getDate()/7)===r.nth) out.push(new Date(d));
    }
  }
  return out;
}
function repText(t){
  const r=normRepeat(t); if(!r) return "";
  let s;
  if(r.f==="W"){
    const n=r.n||1;
    s=(n===1?"매주":n===2?"격주":n+"주마다")+" "+r.d.map(x=>DOW[x]).join("·");
  }
  else if(r.f==="M") s="매월 "+r.day+"일";
  else s="매월 "+NTH[(r.nth||1)-1]+" "+DOW[r.d];
  return s;
}
function repToken(t){                               // 동기화 텍스트용(읽기 가능)
  const r=normRepeat(t); if(!r) return "";
  let s;
  if(r.f==="W"){ const n=r.n||1;
    s=(n===1?"매주":n===2?"격주":n+"주")+r.d.map(x=>DOW[x]).join(""); }
  else if(r.f==="M") s="매월"+r.day;
  else s="매월"+NTH[(r.nth||1)-1]+DOW[r.d];
  if(t.until) s+="~"+t.until;
  return s;
}
function parseRepToken(tok){                        // {repeat,until} 또는 null
  tok=(tok||"").trim(); if(!tok) return null;
  let until="";
  const um=/^(.*?)~(\d{4}-\d{2}-\d{2})$/.exec(tok);
  if(um){ tok=um[1]; until=um[2]; }
  const DI=c=>DOW.indexOf(c);
  let m=/^(매주|격주|(\d+)주)([일월화수목금토]+)$/.exec(tok);
  if(m){ const n=m[1]==="매주"?1:(m[1]==="격주"?2:+m[2]);
    return {repeat:{f:"W",d:[...m[3]].map(DI),n},until}; }
  m=/^매월(첫째|둘째|셋째|넷째|다섯째)([일월화수목금토])$/.exec(tok);
  if(m) return {repeat:{f:"MW",nth:NTH.indexOf(m[1])+1,d:DI(m[2])},until};
  m=/^매월(\d{1,2})$/.exec(tok);
  if(m) return {repeat:{f:"M",day:+m[1]},until};
  m=/^W(\d)$/.exec(tok);
  if(m) return {repeat:{f:"W",d:[+m[1]%7],n:1},until};
  m=/^M(\d{1,2})$/.exec(tok);
  if(m) return {repeat:{f:"M",day:+m[1]},until};
  return null;
}
/* ---- 되돌리기(실행 취소): 변경 직전 상태를 스냅샷 ---- */
const hist=[]; let lastSnap=0;
function snap(){
  const now=Date.now(); if(now-lastSnap<800) return; lastSnap=now;
  try{ hist.push(JSON.stringify(state.tasks)); if(hist.length>30) hist.shift(); updUndo(); }catch(e){}
}
function updUndo(){ const b=document.getElementById("btn-undo"); if(b) b.disabled=!hist.length; }
function doUndo(){
  if(!hist.length) return;
  try{ state.tasks=JSON.parse(hist.pop()); }catch(e){ return; }
  state.tasks.forEach(normRepeat);
  render(); updUndo(); toast("되돌렸습니다");
}
function applyTheme(){
  const t=state.theme||"auto";
  const dark = t==="dark" || (t==="auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark?"dark":"light";
}
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(state.theme==="auto") applyTheme(); }); }catch(e){}
function inkOn(hex){ // 막대 색 밝기에 따라 흰/검정 글씨 선택
  const h=hex.replace("#",""); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  const lin=c=>{c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
  const L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
  return (1.05/(L+0.05) >= (L+0.05)/0.05) ? "#fff" : "#141414";
}
function sample(){const b=today0();
  const mk=(n,s,l,p,g)=>({id:uid(),name:n,start:fmtD(addDays(b,s)),end:fmtD(addDays(b,s+l)),progress:p,group:g});
  return [mk("문헌 조사",-7,6,100,"연구 과제"),mk("모델 개발",0,13,45,"연구 과제"),
          mk("시험·검증",10,9,0,"연구 과제"),mk("보고서 작성",18,7,0,"연구 과제"),
          {id:uid(),name:"주간 팀 회의",start:fmtD(addDays(b,-7)),end:fmtD(addDays(b,-7)),progress:0,repeat:{f:"W",d:[1],n:1},time:"10:00~11:00"}];}

/* ---- QR 생성기 (바이트 모드 · EC레벨 M · 마스크 0 고정 · 버전 1~30) ---- */
const QRGEN=(function(){
  const ECC_M=[10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28];
  const NB_M =[1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29];
  // GF(256), poly 0x11D
  const EXP=new Array(512), LOG=new Array(256);
  (function(){ let x=1; for(let i=0;i<255;i++){EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100)x^=0x11D;} for(let i=255;i<512;i++)EXP[i]=EXP[i-255]; })();
  function gmul(a,b){ return (a&&b)?EXP[LOG[a]+LOG[b]]:0; }
  function rsGen(n){ let g=[1];
    for(let i=0;i<n;i++){ const ng=new Array(g.length+1).fill(0);
      for(let j=0;j<g.length;j++){ ng[j]^=gmul(g[j],EXP[i]); ng[j+1]^=g[j]; }
      g=ng; }
    return g; }
  function rsRemainder(data,ecLen){
    const g=rsGen(ecLen), r=new Array(ecLen).fill(0);
    for(const b of data){ const f=b^r[0]; r.shift(); r.push(0);
      if(f) for(let j=0;j<ecLen;j++) r[j]^=gmul(g[j+1],EXP[LOG[f]]); }
    return r; }
  function rawBits(v){ let r=(16*v+128)*v+64;
    if(v>=2){ const a=Math.floor(v/7)+2; r-=(25*a-10)*a-55; if(v>=7)r-=36; }
    return r; }
  function totalCW(v){ return Math.floor(rawBits(v)/8); }
  function dataCW(v){ return totalCW(v)-NB_M[v-1]*ECC_M[v-1]; }
  function capBytes(v){ const cnt=v<10?8:16; return Math.floor((dataCW(v)*8-4-cnt)/8); }
  function pickVer(len){ for(let v=1;v<=30;v++) if(capBytes(v)>=len) return v; return -1; }
  function bch(val,poly,deg){ let r=val<<deg;
    for(let i=14;i>=deg;i--){ /* generic below */ }
    return r; }
  function bchRem(val,poly){ // poly 최고차수 기준 나머지
    const deg=31-Math.clz32(poly);
    let v=val;
    for(let i=31-Math.clz32(v);i>=deg;i=31-Math.clz32(v)){
      v^=poly<<(i-deg); if(!v)break;
    }
    return v; }
  function fmtBits(mask){ // EC M = 00
    const d=(0<<3)|mask, r=bchRem(d<<10,0x537);
    return ((d<<10)|r)^0x5412; }
  function verBits(v){ const r=bchRem(v<<12,0x1F25); return (v<<12)|r; }
  function alignPos(v){
    if(v===1) return [];
    const n=Math.floor(v/7)+2, size=17+4*v;
    const step=(v===32)?26:Math.floor((v*4+n*2+1)/(n*2-2))*2;
    const pos=[6]; let p=size-7;
    for(let i=0;i<n-1;i++){ pos.splice(1,0,p); p-=step; }
    return pos; }
  function encode(text){ // text: 바이트 문자열(각 charCode ≤255)
    const bytes=[]; for(let i=0;i<text.length;i++) bytes.push(text.charCodeAt(i)&0xFF);
    const v=pickVer(bytes.length); if(v<0) return null;
    const cnt=v<10?8:16;
    // 비트 버퍼
    const bits=[]; const put=(val,n)=>{ for(let i=n-1;i>=0;i--) bits.push((val>>>i)&1); };
    put(4,4); put(bytes.length,cnt);
    for(const b of bytes) put(b,8);
    const dcw=dataCW(v);
    const cap=dcw*8;
    put(0,Math.min(4,cap-bits.length));
    while(bits.length%8) bits.push(0);
    const dcws=[]; for(let i=0;i<bits.length;i+=8){ let x=0; for(let j=0;j<8;j++) x=(x<<1)|bits[i+j]; dcws.push(x); }
    const pads=[0xEC,0x11]; let pi=0;
    while(dcws.length<dcw){ dcws.push(pads[pi]); pi^=1; }
    // 블록 분할 + EC
    const nb=NB_M[v-1], ec=ECC_M[v-1];
    const shortLen=Math.floor(dcw/nb), numLong=dcw%nb;
    const blocks=[], eccs=[]; let off=0;
    for(let b=0;b<nb;b++){ const len=shortLen+(b>=nb-numLong?1:0);
      const d=dcws.slice(off,off+len); off+=len;
      blocks.push(d); eccs.push(rsRemainder(d,ec)); }
    // 인터리브
    const out=[];
    const maxLen=shortLen+(numLong?1:0);
    for(let i=0;i<maxLen;i++) for(let b=0;b<nb;b++) if(i<blocks[b].length) out.push(blocks[b][i]);
    for(let i=0;i<ec;i++) for(let b=0;b<nb;b++) out.push(eccs[b][i]);
    // ---- 매트릭스 ----
    const size=17+4*v;
    const M=Array.from({length:size},()=>new Array(size).fill(null)); // null=미정
    const FUN=Array.from({length:size},()=>new Array(size).fill(false));
    const set=(r,c,val)=>{ M[r][c]=val?1:0; FUN[r][c]=true; };
    function finder(r,c){
      for(let dr=-1;dr<=7;dr++) for(let dc=-1;dc<=7;dc++){
        const rr=r+dr, cc=c+dc; if(rr<0||cc<0||rr>=size||cc>=size) continue;
        const on=(dr>=0&&dr<=6&&dc>=0&&dc<=6)&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4));
        set(rr,cc,on);
      } }
    finder(0,0); finder(0,size-7); finder(size-7,0);
    // 타이밍
    for(let i=8;i<size-8;i++){ if(!FUN[6][i])set(6,i,i%2===0); if(!FUN[i][6])set(i,6,i%2===0); }
    // 얼라인먼트
    const ap=alignPos(v);
    for(const r of ap) for(const c of ap){
      const corner=(r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8);
      if(corner) continue; // 파인더 모서리 3곳만 제외
      for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++)
        set(r+dr,c+dc, Math.max(Math.abs(dr),Math.abs(dc))!==1);
    }
    // 포맷 자리 예약(값은 뒤에) + 다크 모듈
    const fb=fmtBits(0), gB=(x,i)=>(x>>>i)&1;
    // 사본 1 (좌상단)
    for(let i=0;i<=5;i++) set(8,i,gB(fb,i));
    set(8,7,gB(fb,6)); set(8,8,gB(fb,7)); set(7,8,gB(fb,8));
    for(let i=9;i<15;i++) set(14-i,8,gB(fb,i));
    // 사본 2 (하단 세로 7 + 우측 가로 8)
    for(let i=0;i<7;i++) set(size-1-i,8,gB(fb,i));
    for(let i=7;i<15;i++) set(8,size-15+i,gB(fb,i));
    set(size-8,8,1); // 다크 모듈
    // 버전 정보
    if(v>=7){ const vb=verBits(v);
      for(let i=0;i<18;i++){ const bit=(vb>>>i)&1;
        set(Math.floor(i/3), size-11+(i%3), bit);
        set(size-11+(i%3), Math.floor(i/3), bit);
      } }
    // 데이터 배치(지그재그) + 마스크0
    let bi=0; const total=out.length*8;
    const dataBit=k=> k<total ? (out[k>>3]>>>(7-(k&7)))&1 : 0;
    let upward=true;
    for(let col=size-1;col>0;col-=2){
      if(col===6) col--;
      for(let k=0;k<size;k++){
        const r=upward?size-1-k:k;
        for(const c of [col,col-1]){
          if(FUN[r][c]) continue;
          let bit=dataBit(bi++); 
          if((r+c)%2===0) bit^=1; // 마스크 0
          M[r][c]=bit;
        }
      }
      upward=!upward;
    }
    return {size,M,v,placed:bi,totalBits:total,raw:rawBits(v)};
  }
  return {encode,capBytes,pickVer,totalCW,dataCW,fmtBits,verBits,alignPos,rsRemainder,rsGen,EXP,LOG,gmul};
})();

  closePop();
  document.documentElement.style.setProperty("--left-w",(state.leftW||346)+"px");
  document.getElementById("zoom").classList.toggle("hide",state.view!=="gantt");
  const ba=document.getElementById("btn-all");
  ba.classList.toggle("hide",state.view!=="cal");
  ba.textContent=state.calAll?"간략히":"모두 표시";
  ba.classList.toggle("primary",state.calAll);
  const bd=document.getElementById("btn-done");
  bd.textContent=state.hideDone?"완료 표시":"완료 숨기기";
  bd.classList.toggle("primary",state.hideDone);
  applyTheme();
  document.getElementById("btn-theme").textContent=
    state.theme==="auto"?"◐ 자동":(state.theme==="dark"?"☾ 다크":"☀ 라이트");
  updUndo();
  document.querySelectorAll("#view button").forEach(b=>b.classList.toggle("on",b.dataset.v===state.view));
  document.querySelectorAll("#zoom button").forEach(b=>b.classList.toggle("on",b.dataset.z===state.zoom));
  const st=document.getElementById("stage");
  if(state.view==="gantt") st.innerHTML=viewGantt();
  else if(state.view==="cal") st.innerHTML=viewCal();
  else st.innerHTML=viewList();
  if(flashId){const el=document.querySelector('.card[data-tid="'+flashId+'"]');
    if(el){el.classList.add("flash");el.scrollIntoView({block:"center",behavior:"smooth"});}
    flashId=null;}
  save();
}

/* ================= gantt ================= */
function range(){
  const z=ZOOM[state.zoom]; let lo,hi;
  for(const t of state.tasks){ if(t.repeat) continue;
    const s=parseD(t.start),e=parseD(t.end);
    if(!lo||s<lo)lo=s; if(!hi||e>hi)hi=e;}
  if(!lo){const t=today0();lo=addDays(t,-7);hi=addDays(t,21);}
  const td=today0(); if(td<lo)lo=td; if(td>hi)hi=td;
  return {start:addDays(lo,-z.pad),end:addDays(hi,z.pad)};
}
function viewGantt(){
  if(!state.tasks.length) return '<div class="empty">작업이 없습니다. 상단의 <b>+ 작업</b>으로 시작하세요.</div>';
  const W=ZOOM[state.zoom].w, {start,end}=range();
  const total=daysBetween(start,end)+1, tlw=Math.round(total*W);
  let months="",days="",m=-1,ms=0;
  const showNum=state.zoom!=="month";
  let weCells="";
  for(let i=0;i<total;i++){
    const dt=addDays(start,i),dow=dt.getDay(),we=(dow===0||dow===6);
    if(dt.getMonth()!==m){ if(m>=0)months+='<div class="th-month" style="width:'+((i-ms)*W)+'px">'+MONTHS[m]+'</div>';
      m=dt.getMonth();ms=i;}
    let cls="th-day"+(we?" we":""),txt="";
    if(showNum){ if(state.zoom==="day"){txt=dt.getDate(); if(dt.getDate()===1||dow===1)cls+=" tick";}
      else if(dow===1){txt=dt.getDate();cls+=" tick";} }
    days+='<div class="'+cls+'" style="width:'+W+'px">'+txt+'</div>';
    if(we&&state.zoom!=="month") weCells+='<div class="cell we" style="left:'+(i*W)+'px;width:'+W+'px"></div>';
  }
  months+='<div class="th-month" style="width:'+((total-ms)*W)+'px">'+MONTHS[m]+'</div>';
  const td=today0(), tdX=(daysBetween(start,td)+0.5)*W;

  let rows="";
  const gcol=new Set(state.gcol||[]);
  function taskRow(t,i,gname){
    if(state.hideDone&&isDone(t)) return "";
    const c=colorOf(t,i), pg=Math.max(0,Math.min(100,+t.progress||0));
    const urg=isUrgent(t), done=isDone(t), rp=!!t.repeat;
    let timeCell;
    if(rp){
      let marks="";
      occurrences(t,start,end).forEach(d=>{
        marks+='<span class="g-rep" style="left:'+((daysBetween(start,d)+0.5)*W)+'px;color:'+c+'">✦</span>';});
      timeCell=weCells+marks;
    }else{
      const st=parseD(t.start),en=parseD(t.end);
      const left=daysBetween(start,st)*W, w=Math.max((daysBetween(st,en)+1)*W,6);
      timeCell=weCells
        +'<div class="bar'+(urg?" urgent":"")+(done?" done":"")+'" style="left:'+left+'px;width:'+w+'px;--barc:'+c+'">'
        +'<div class="fill" style="width:'+pg+'%"></div><span class="lbl" style="color:'+inkOn(c)+'">'+(done?"✓":pg+"%")+'</span></div>';
    }
    return '<div class="row'+(urg?" urgent":"")+(done?" done":"")+(rp?" rep":"")+'" data-i="'+i+'" data-g="'+esc(gname||"")+'">'
      +'<div class="r-left">'
        +'<span class="grip" title="끌어서 순서 변경">⠿</span>'
        +'<button class="sw" title="색상" style="background:'+c+'"></button>'
        +(urg?'<span class="uico" title="긴급">⚠</span>':'')
        +'<input class="name" value="'+esc(t.name)+'" data-k="name" placeholder="작업명">'
        +(rp
          ?'<input class="date" type="date" value="'+t.start+'" data-k="start"><span class="rrule">'+repText(t)+' · ✦</span>'
          :'<input class="date" type="date" value="'+t.start+'" data-k="start">'
           +'<input class="date" type="date" value="'+t.end+'" data-k="end">'
           +'<input class="prog" type="number" min="0" max="100" value="'+pg+'" data-k="progress">')
        +(rp?'':'<button class="flag'+(t.urgent?" on":"")+'" title="긴급 표시">⚑</button>')
        +'<button class="del" title="삭제">×</button>'
      +'</div>'
      +'<div class="r-time" style="width:'+tlw+'px">'+timeCell+'</div></div>';
  }
  // 1단계 그룹: 등장 순서대로 묶고, 그룹 머리행 + 접기 + 요약 막대
  const buckets=[], bmap={};
  state.tasks.forEach((t,i)=>{
    const g=(t.group||"").trim();
    if(!(g in bmap)){ bmap[g]={name:g,items:[]}; buckets.push(bmap[g]); }
    bmap[g].items.push({t,i});
  });
  const hasNamed=buckets.some(x=>!!x.name);
  for(const b of buckets){
    if(!b.name&&!hasNamed){ for(const {t,i} of b.items) rows+=taskRow(t,i,""); continue; }
    const label=b.name||"미지정";
    const open=!gcol.has(b.name);
    let lo=null,hi=null,vis=0;
    for(const {t} of b.items){
      if(state.hideDone&&isDone(t)) continue;
      vis++;
      if(t.repeat) continue;
      const st=parseD(t.start),en=parseD(t.end);
      if(!lo||st<lo)lo=st; if(!hi||en>hi)hi=en;
    }
    let gb="";
    if(lo&&hi){
      const gl=daysBetween(start,lo)*W, gw=Math.max((daysBetween(lo,hi)+1)*W,8);
      gb='<div class="gbar" style="left:'+gl+'px;width:'+gw+'px"></div>';
    }
    rows+='<div class="row ghead" data-g="'+esc(b.name)+'">'
      +'<div class="r-left"><span class="grip" title="끌어서 그룹 순서 변경">⠿</span>'
      +'<button class="gtg">'+(open?"▾":"▸")+'</button>'
      +'<span class="gname'+(b.name?"":" unnamed")+'">'+esc(label)+'</span><span class="gcnt">'+vis+'</span></div>'
      +'<div class="r-time" style="width:'+tlw+'px">'+weCells+gb+'</div></div>';
    if(open) for(const {t,i} of b.items) rows+=taskRow(t,i,b.name);
  }
  return '<div class="grid"><div class="head">'
    +'<div class="corner"><div class="ch"><span class="c-sw"></span><span class="c-name">작업명</span>'
    +'<span class="c-date">시작</span><span class="c-date">종료</span><span class="c-prog">진행</span><span class="c-x"></span></div><div class="resizer" id="resizer" title="드래그하여 너비 조절"></div></div>'
    +'<div class="timeline-head" style="width:'+tlw+'px">'
      +'<div style="position:relative;height:0"><div class="today-flag" style="left:'+tdX+'px">오늘 '+shortD(fmtD(td))+'</div></div>'
      +'<div class="th-months">'+months+'</div><div class="th-days">'+days+'</div></div></div>'
    +'<div class="body" style="position:relative">'+rows
      +'<div class="today-line" style="left:calc(var(--left-w) + '+tdX+'px)"></div></div></div>';
}

/* ================= calendar ================= */
function calBase(){ if(!state.cal){const t=today0();state.cal=new Date(t.getFullYear(),t.getMonth(),1);} return state.cal; }
function viewCal(){
  const base=calBase(), y=base.getFullYear(), mo=base.getMonth();
  const first=new Date(y,mo,1), last=new Date(y,mo+1,0);
  const gridStart=addDays(first,-first.getDay());
  const weeks=Math.ceil((last.getDay()===6?daysBetween(gridStart,last)+1:daysBetween(gridStart,last)+(7-last.getDay()))/7);
  const td=today0();

  const segs=state.tasks.map((t,i)=>({i,t,s:parseD(t.start),e:parseD(t.end),c:colorOf(t,i)}))
    .filter(g=>!g.t.repeat && !(state.hideDone&&isDone(g.t)));
  const gridEnd=addDays(gridStart,weeks*7-1);
  state.tasks.forEach((t,i)=>{
    if(!t.repeat) return;
    occurrences(t,gridStart,gridEnd).forEach(d=>segs.push({i,t,s:d,e:d,c:colorOf(t,i),rep:true}));
  });
  segs.sort((a,b)=>a.s-b.s || (b.e-b.s)-(a.e-a.s));

  // ---- fit the whole month into the visible area ----
  const stageEl=document.getElementById("stage");
  const availH=(stageEl?stageEl.clientHeight:window.innerHeight-120);
  const HEADS=54+29;                     // cal-nav + weekday row
  const MINWK=60;                        // never thinner than this (then it scrolls)
  const wkH=Math.max(MINWK, Math.floor((availH-HEADS-2)/weeks));
  const laneFit=Math.max(1, Math.floor((wkH-LANE_TOP-4)/LANE_H));  // lanes that fit in a week

  let html='<div class="cal"><div class="cal-nav">'
    +'<button id="cal-prev">‹</button><span class="mlabel">'+y+'년 '+MONTHS[mo]+'</span><button id="cal-next">›</button></div>'
    +'<div class="cal-dow">'+DOW.map(d=>'<div>'+d+'</div>').join("")+'</div>';

  for(let w=0;w<weeks;w++){
    const ws=addDays(gridStart,w*7), we=addDays(ws,6), wkey=fmtD(ws);
    // 1) place every overlapping task into a lane
    const lanes=[], placed=[];
    for(const g of segs){
      if(g.e<ws||g.s>we) continue;
      const s=g.s<ws?ws:g.s, e=g.e>we?we:g.e;
      const a=daysBetween(ws,s), b=daysBetween(ws,e);
      let lane=0; while(lanes[lane]&&lanes[lane].some(r=>!(b<r[0]||a>r[1]))) lane++;
      (lanes[lane]=lanes[lane]||[]).push([a,b]);
      placed.push({g,a,b,lane});
    }
    // 2) cap lanes to what fits (unless this week is expanded)
    const expanded=state.calAll||openWeeks.has(wkey);
    const needMore=lanes.length>laneFit;
    const cap=expanded?Infinity:(needMore?Math.max(1,laneFit-1):laneFit); // reserve a row for +N
    let bars="", overflow={};
    for(const p of placed){
      if(p.lane>=cap){ for(let d=p.a;d<=p.b;d++) overflow[d]=(overflow[d]||0)+1; continue; }
      if(p.g.rep){
        bars+='<div class="cal-rep" data-tid="'+p.g.t.id+'" style="left:calc('+((p.a+0.5)/7*100)+'%);'
          +'top:'+(LANE_TOP+p.lane*LANE_H)+'px;color:'+p.g.c+'" title="'+esc(p.g.t.name)+'">✦</div>';
        continue;
      }
      const urg=isUrgent(p.g.t), done=isDone(p.g.t);
      bars+='<div class="cal-bar'+(p.g.s<ws?" cutL":"")+(p.g.e>we?" cutR":"")+(urg?" urgent":"")+(done?" done":"")+'" data-tid="'+p.g.t.id+'" '
        +'style="left:calc('+(p.a/7*100)+'% + 2px);width:calc('+((p.b-p.a+1)/7*100)+'% - 4px);'
        +'top:'+(LANE_TOP+p.lane*LANE_H)+'px;--barc:'+p.g.c+'"><span style="color:'+inkOn(p.g.c)+'">'+(urg?"⚠ ":"")+esc(p.g.t.name)+'</span></div>';
    }
    const hasMore=Object.keys(overflow).length>0;
    // fixed height so the month always fills the screen; expanded busy weeks may grow & scroll
    const h=expanded?Math.max(wkH,LANE_TOP+lanes.length*LANE_H+18):wkH;
    let cells="";
    for(let d=0;d<7;d++){
      const dt=addDays(ws,d), out=dt.getMonth()!==mo, we2=(d===0||d===6);
      cells+='<div class="cal-cell'+(we2?" we":"")+(out?" out":"")+(dt.getTime()===td.getTime()?" tdy":"")+'">'
        +'<div class="dnum">'+dt.getDate()+'</div>'
        +(overflow[d]?'<button class="more" data-wk="'+wkey+'">+'+overflow[d]+'</button>':'')
        +'</div>';
    }
    html+='<div class="cal-week" style="--wk-h:'+h+'px"><div class="cal-cells">'+cells+'</div>'
      +'<div class="cal-bars">'+bars+'</div>'
      +(expanded&&needMore?'<button class="wk-collapse" data-wk="'+wkey+'">접기</button>':'')
      +'</div>';
  }
  return html+'</div>';
}

function viewList(){
  if(!state.tasks.length) return '<div class="empty">작업이 없습니다. 상단의 <b>+ 작업</b>으로 시작하세요.</div>';
  const td=today0();
  const order=state.tasks.map((t,i)=>({t,i})).sort((a,b)=>parseD(a.t.start)-parseD(b.t.start));
  let out='<div class="list">';
  const gnames=[...new Set(state.tasks.map(t=>(t.group||"").trim()).filter(Boolean))];
  function card(t,i){
    const c=colorOf(t,i), pg=Math.max(0,Math.min(100,+t.progress||0));
    const s=parseD(t.start), e=parseD(t.end), len=daysBetween(s,e)+1;
    const urg=isUrgent(t), done=isDone(t), R=normRepeat(t), rp=!!R;
    let meta;
    if(rp){
      const nx=occurrences(t,td,addDays(td,120))[0];
      meta="반복 · "+repText(t)+(t.until?" · "+t.until+"까지":" · 무기한")
          +(nx?" · 다음 "+shortD(fmtD(nx))+"("+DOW[nx.getDay()]+")":"");
    }
    else if(done) meta="완료 ✓ · 총 "+len+"일";
    else if(td<s) meta="시작까지 "+daysBetween(td,s)+"일 · 총 "+len+"일";
    else if(td>e) meta="기한 지남 · "+daysBetween(e,td)+"일 초과";
    else meta="진행 중 · 종료까지 "+daysBetween(td,e)+"일";
    return '<div class="card'+(urg?" urgent":"")+(done?" done":"")+'" data-i="'+i+'" data-tid="'+t.id+'">'
      +'<div class="c1"><button class="sw" title="색상" style="background:'+c+'"></button>'
        +(urg?'<span class="uico" title="긴급">⚠</span>':'')
        +(rp?'<span class="uico" style="color:'+c+'" title="반복">✦</span>':'')
        +'<input class="name" value="'+esc(t.name)+'" data-k="name" placeholder="작업명">'
        +(rp?'':'<button class="flag'+(t.urgent?" on":"")+'" title="긴급 표시">⚑</button>')
        +'<button class="del" title="삭제">×</button></div>'
      +'<div class="c2"><input class="date" type="date" value="'+t.start+'" data-k="start">'
        +(rp?'':'<span class="arw">→</span><input class="date" type="date" value="'+t.end+'" data-k="end">'
          +'<input class="prog" type="number" min="0" max="100" value="'+pg+'" data-k="progress">%')+'</div>'
      +'<div class="c3">'
        +(function(){
          let h='<select class="ginp" data-k="groupsel">'
            +'<option value=""'+((t.group||"")===""?" selected":"")+'>미지정</option>';
          for(const g of gnames)
            h+='<option value="'+esc(g)+'"'+((t.group||"")===g?" selected":"")+'>'+esc(g)+'</option>';
          h+='<option value="__new__">＋ 새 그룹…</option></select>';
          return h;
        })()
        +'<input class="tinp" placeholder="시간 예) 10:00~11:30" value="'+esc(t.time||"")+'" data-k="time" style="width:158px">'
      +'</div>'
      +'<div class="c3">'
        +(function(){
          const f=R?R.f:"", n=R&&R.f==="W"?(R.n||1):1;
          const fv=!R?"":(f==="W"?"W"+Math.min(n,4):f);
          let h='<select data-k="repfreq">'
            +'<option value=""'+(fv===""?" selected":"")+'>반복 없음</option>'
            +'<option value="W1"'+(fv==="W1"?" selected":"")+'>매주</option>'
            +'<option value="W2"'+(fv==="W2"?" selected":"")+'>격주</option>'
            +'<option value="W3"'+(fv==="W3"?" selected":"")+'>3주마다</option>'
            +'<option value="W4"'+(fv==="W4"?" selected":"")+'>4주마다</option>'
            +'<option value="M"'+(fv==="M"?" selected":"")+'>매월(날짜)</option>'
            +'<option value="MW"'+(fv==="MW"?" selected":"")+'>매월(n번째 요일)</option></select>';
          if(f==="W"){
            h+='<span class="chips">';
            for(let d=0;d<7;d++)
              h+='<button class="dchip'+(R.d.includes(d)?" on":"")+'" data-d="'+d+'">'+DOW[d]+'</button>';
            h+='</span>';
          }else if(f==="M"){
            h+='<input type="number" data-k="repday" min="1" max="31" value="'+R.day+'" style="width:58px">일';
          }else if(f==="MW"){
            h+='<select data-k="repnth">';
            for(let k=1;k<=5;k++) h+='<option value="'+k+'"'+(R.nth===k?" selected":"")+'>'+NTH[k-1]+'</option>';
            h+='</select><select data-k="repdow2">';
            for(let d=0;d<7;d++) h+='<option value="'+d+'"'+(R.d===d?" selected":"")+'>'+DOW[d]+'요일</option>';
            h+='</select>';
          }
          if(R){
            h+='<select data-k="repuntilmode">'
              +'<option value=""'+(t.until?"":" selected")+'>무기한</option>'
              +'<option value="date"'+(t.until?" selected":"")+'>종료일</option></select>';
            if(t.until) h+='<input class="date" type="date" value="'+t.until+'" data-k="repuntil">';
          }
          return h;
        })()
      +'</div>'
      +'<div class="c3"><input class="minp" placeholder="메모" value="'+esc(t.memo||"")+'" data-k="memo" style="flex:1;min-width:150px"></div>'
      +(rp?'':'<div class="track"><i style="width:'+pg+'%;--barc:'+c+';background:'+c+'"></i></div>')
      +'<div class="meta">'+meta+'</div></div>';
  }
  const gcol=new Set(state.gcol||[]);
  const buckets=[], bmap={};
  for(const {t,i} of order){
    if(state.hideDone&&isDone(t)) continue;
    const g=(t.group||"").trim();
    if(!(g in bmap)){ bmap[g]={name:g,items:[]}; buckets.push(bmap[g]); }
    bmap[g].items.push({t,i});
  }
  const hasNamed=buckets.some(x=>!!x.name);
  for(const b of buckets){
    if(b.name) out+='<div class="lsec">'+esc(b.name)+'</div>';
    else if(hasNamed) out+='<div class="lsec unnamed">미지정</div>';
    for(const {t,i} of b.items) out+=card(t,i);
  }
  return out+'</div>';
}

/* ================= events ================= */
const stage=document.getElementById("stage");

stage.addEventListener("input",e=>{
  const inp=e.target.closest("input[data-k],select[data-k]"); if(!inp) return;
  const host=inp.closest("[data-i]"); if(!host) return;
  const t=state.tasks[+host.dataset.i], k=inp.dataset.k;
  if(k==="name"){snap();t.name=inp.value;save();return;}
  if(k==="progress"){
    snap();
    const was=isDone(t), wasU=isUrgent(t);
    const v=Math.max(0,Math.min(100,+inp.value||0)); t.progress=v;
    const bar=host.querySelector(".bar");
    if(bar){bar.querySelector(".fill").style.width=v+"%";bar.querySelector(".lbl").textContent=(v>=100?"✓":v+"%");}
    const tr=host.querySelector(".track i"); if(tr)tr.style.width=v+"%";
    save();
    if(was!==isDone(t)||wasU!==isUrgent(t)) render();
    return;
  }
});
stage.addEventListener("change",e=>{
  const inp=e.target.closest("input[data-k],select[data-k]"); if(!inp) return;
  const host=inp.closest("[data-i]"); if(!host) return;
  const t=state.tasks[+host.dataset.i], k=inp.dataset.k;
  if(k==="start"||k==="end"){
    if(!inp.value) return;
    snap(); t[k]=inp.value;
    if(parseD(t.end)<parseD(t.start)){ if(k==="start")t.end=t.start; else t.start=t.end; }
    render(); return;
  }
  if(k==="groupsel"){
    if(inp.value==="__new__"){
      const ni=document.createElement("input");
      ni.setAttribute("data-k","groupnew");
      ni.placeholder="새 그룹 이름 입력 후 Enter";
      ni.className="ginp";
      inp.replaceWith(ni); ni.focus();
      return;
    }
    snap(); t.group=inp.value; render(); return;
  }
  if(k==="groupnew"){
    const v=inp.value.trim();
    if(v){ snap(); t.group=v; }
    render(); return;
  }
  if(k==="time"){ snap(); t.time=inp.value.trim(); render(); return; }
  if(k==="memo"){ snap(); t.memo=inp.value.trim(); render(); return; }
  if(k==="repfreq"){
    snap();
    const v=inp.value, sd=parseD(t.start);
    if(!v){ delete t.repeat; delete t.until; }
    else if(v[0]==="W"){
      const prev=normRepeat(t);
      t.repeat={f:"W",d:(prev&&prev.f==="W"&&prev.d.length)?prev.d:[sd.getDay()],n:+v[1]||1};
    }
    else if(v==="M"){ t.repeat={f:"M",day:sd.getDate()}; }
    else { t.repeat={f:"MW",nth:Math.min(5,Math.ceil(sd.getDate()/7)),d:sd.getDay()}; }
    render(); return;
  }
  if(k==="repday"){ const R=normRepeat(t); if(R&&R.f==="M"){ snap(); R.day=Math.max(1,Math.min(31,+inp.value||25)); render(); } return; }
  if(k==="repnth"){ const R=normRepeat(t); if(R&&R.f==="MW"){ snap(); R.nth=Math.max(1,Math.min(5,+inp.value||1)); render(); } return; }
  if(k==="repdow2"){ const R=normRepeat(t); if(R&&R.f==="MW"){ snap(); R.d=(+inp.value)%7; render(); } return; }
  if(k==="repuntilmode"){
    snap();
    if(inp.value==="date"){ t.until=t.until||fmtD(addDays(today0(),90)); }
    else delete t.until;
    render(); return;
  }
  if(k==="repuntil"){ if(inp.value){ snap(); t.until=inp.value; render(); } return; }
});
stage.addEventListener("click",e=>{
  const sw=e.target.closest(".sw");
  if(sw){ openPop(sw,+sw.closest("[data-i]").dataset.i); return; }
  const gh=e.target.closest(".ghead");
  if(gh&&(e.target.closest(".gtg")||e.target.closest(".gname"))){
    const g=gh.dataset.g, set=new Set(state.gcol||[]);
    if(set.has(g)) set.delete(g); else set.add(g);
    state.gcol=[...set]; render(); return;
  }
  const ch=e.target.closest(".dchip");
  if(ch){
    const t=state.tasks[+ch.closest("[data-i]").dataset.i], R=normRepeat(t);
    if(R&&R.f==="W"){
      const d=+ch.dataset.d;
      if(R.d.includes(d)){ if(R.d.length>1){ snap(); R.d=R.d.filter(x=>x!==d); render(); } }
      else { snap(); R.d=[...R.d,d].sort(); render(); }
    }
    return;
  }
  const fl=e.target.closest(".flag");
  if(fl){ snap(); const t=state.tasks[+fl.closest("[data-i]").dataset.i]; t.urgent=!t.urgent; render(); return; }
  const del=e.target.closest(".del");
  if(del){ snap(); state.tasks.splice(+del.closest("[data-i]").dataset.i,1); render(); return; }
  const cb=e.target.closest(".cal-bar,.cal-rep");
  if(cb){ flashId=cb.dataset.tid; state.view="list"; render(); return; }
  const more=e.target.closest(".more,.wk-collapse");
  if(more){
    const k=more.dataset.wk;
    if(openWeeks.has(k)) openWeeks.delete(k); else openWeeks.add(k);
    render(); return;
  }
  if(e.target.id==="cal-prev"){ state.cal=new Date(calBase().getFullYear(),calBase().getMonth()-1,1); render(); return; }
  if(e.target.id==="cal-next"){ state.cal=new Date(calBase().getFullYear(),calBase().getMonth()+1,1); render(); return; }
});

(function(){
  let dragging=false, startX=0, startW=0;
  const MIN=120, MAX=680;
  function down(e){
    const h=e.target.closest("#resizer"); if(!h) return;
    dragging=true; h.classList.add("drag");
    startX=(e.touches?e.touches[0].clientX:e.clientX); startW=state.leftW||346;
    e.preventDefault();
  }
  function move(e){
    if(!dragging) return;
    const x=(e.touches?e.touches[0].clientX:e.clientX);
    const w=Math.max(MIN,Math.min(MAX,startW+(x-startX)));
    state.leftW=Math.round(w);
    document.documentElement.style.setProperty("--left-w",state.leftW+"px");
  }
  function up(){
    if(!dragging) return;
    dragging=false;
    const h=document.getElementById("resizer"); if(h)h.classList.remove("drag");
    save();
  }
  stage.addEventListener("mousedown",down);
  stage.addEventListener("touchstart",down,{passive:false});
  window.addEventListener("mousemove",move);
  window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up);
  window.addEventListener("touchend",up);
})();

/* ---- 행 위아래 드래그로 순서 변경 (작업: 그룹 간 이동 겸용 / 그룹 머리행: 그룹 통째 이동) ---- */
function rebuildFrom(seq){
  const buckets=[], bmap={};
  const getB=g=>{ g=g||""; if(!(g in bmap)){bmap[g]={name:g,items:[]};buckets.push(bmap[g]);} return bmap[g]; };
  for(const e of seq){
    if(e.kind==="g"){ getB(e.g); continue; }
    const t=state.tasks[e.i]; if(!t) continue;
    const g=(e.newg!==undefined?e.newg:(e.g||"")).trim();
    t.group=g; getB(g).items.push(t);
  }
  const seen=new Set(); buckets.forEach(bk=>bk.items.forEach(t=>seen.add(t.id)));
  state.tasks.forEach(t=>{ if(!seen.has(t.id)) getB((t.group||"").trim()).items.push(t); });
  state.tasks=[].concat.apply([],buckets.map(bk=>bk.items));
}
(function(){
  let rd=null;
  const ent=el=>({kind:el.classList.contains("ghead")?"g":"t",
                  g:el.dataset.g||"",
                  i:el.dataset.i!==undefined?+el.dataset.i:undefined});
  document.addEventListener("pointerdown",e=>{
    const grip=e.target.closest(".grip"); if(!grip||state.view!=="gantt") return;
    const row=grip.closest(".row"); if(!row) return;
    const kind=row.classList.contains("ghead")?"g":"t";
    const block=[row];
    if(kind==="g"){
      let n=row.nextElementSibling;
      while(n&&n.classList.contains("row")&&!n.classList.contains("ghead")&&(n.dataset.g||"")===row.dataset.g){
        block.push(n); n=n.nextElementSibling;
      }
    }
    const body=row.closest(".body"); if(!body) return;
    rd={kind,row,block,body,slot:-1,rows:null};
    block.forEach(el=>el.classList.add("lift"));
    rd.line=document.createElement("div"); rd.line.className="dropline"; body.appendChild(rd.line);
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  document.addEventListener("pointermove",e=>{
    if(!rd) return;
    const rows=[...document.querySelectorAll("#stage .row")].filter(el=>!rd.block.includes(el));
    const y=e.clientY, sr=stage.getBoundingClientRect();
    if(y<sr.top+50) stage.scrollTop-=10; else if(y>sr.bottom-50) stage.scrollTop+=10;
    let slot=rows.length, before=null;
    for(let k=0;k<rows.length;k++){
      const r=rows[k].getBoundingClientRect();
      if(y<r.top+r.height/2){ slot=k; before=rows[k]; break; }
    }
    rd.slot=slot; rd.rows=rows;
    const br=rd.body.getBoundingClientRect();
    const top=before ? before.getBoundingClientRect().top-br.top
      : (rows.length ? rows[rows.length-1].getBoundingClientRect().bottom-br.top : 0);
    rd.line.style.top=(top-1)+"px";
  });
  function finish(){
    if(!rd) return;
    const {kind,row,rows,slot,block}=rd;
    block.forEach(el=>el.classList.remove("lift"));
    rd.line.remove();
    const done=rd; rd=null;
    if(slot<0||!rows) return;                 // 움직이지 않고 놓음
    const seq=rows.map(ent);
    let ins;
    if(kind==="g") ins=block.map(ent);
    else{
      const e2=ent(row);
      let ng="";
      if(slot>0) ng=seq[slot-1].g;
      else if(seq.length&&seq[0].kind!=="g") ng=seq[0].g;
      e2.newg=ng; ins=[e2];
    }
    seq.splice(slot,0,...ins);
    snap();
    rebuildFrom(seq);
    render();
  }
  document.addEventListener("pointerup",finish);
  document.addEventListener("pointercancel",finish);
})();

/* ---- QR 동기화 ---- */
let qrChunks=[], qrIdx=0, pendingQR=null;
function b64u(t){ return btoa(unescape(encodeURIComponent(t))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(t){ return decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/")))); }
function buildQRChunks(){
  const text=enc(state);
  if(location.protocol==="file:"){
    const bytes=unescape(encodeURIComponent(text));
    if(bytes.length<=QRGEN.capBytes(30)) return {mode:"text",chunks:[bytes]};
    return {mode:"toolong"};
  }
  const b=b64u(text);
  const id=Math.random().toString(36).slice(2,5).padEnd(3,"0");
  const base=location.origin+location.pathname+"#q=";
  const per=QRGEN.capBytes(22)-(base.length+12);
  if(per<50) return {mode:"toolong"};
  const total=Math.ceil(b.length/per)||1;
  const chunks=[];
  for(let i=0;i<total;i++)
    chunks.push(base+id+"."+(i+1)+"."+total+"."+b.slice(i*per,(i+1)*per));
  return {mode:"url",chunks};
}
function qrSVG(str){
  const r=QRGEN.encode(str); if(!r) return null;
  const Q=4, W=r.size+Q*2;
  let d="";
  for(let y=0;y<r.size;y++) for(let x=0;x<r.size;x++)
    if(r.M[y][x]) d+="M"+(x+Q)+" "+(y+Q)+"h1v1h-1z";
  return '<svg viewBox="0 0 '+W+' '+W+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'
    +'<rect width="'+W+'" height="'+W+'" fill="#FFFFFF"/>'
    +'<path d="'+d+'" fill="#000000"/></svg>';
}
function showQR(){
  const box=document.getElementById("qrbox");
  const built=buildQRChunks();
  if(built.mode==="toolong"){
    box.classList.remove("hide");
    document.getElementById("qrsvg").innerHTML="";
    document.getElementById("qr-idx").textContent="";
    document.getElementById("qr-hint").textContent="일정이 많아 QR로 담기 어렵습니다. 텍스트 복사 방식을 이용하세요.";
    return;
  }
  qrChunks=built.chunks; qrIdx=0;
  box.classList.remove("hide");
  box.dataset.mode=built.mode;
  renderQR();
}
function renderQR(){
  const svg=qrSVG(qrChunks[qrIdx]);
  document.getElementById("qrsvg").innerHTML=svg||"";
  const multi=qrChunks.length>1;
  document.getElementById("qr-idx").textContent=(qrIdx+1)+" / "+qrChunks.length;
  document.getElementById("qr-prev").classList.toggle("hide",!multi);
  document.getElementById("qr-next").classList.toggle("hide",!multi);
  const box=document.getElementById("qrbox");
  document.getElementById("qr-hint").textContent =
    box.dataset.mode==="text"
      ? "아이폰 카메라로 스캔 후 [복사]를 눌러, 앱의 불러오기에 붙여넣으세요."
      : (multi
        ? "아이폰 카메라로 1번부터 순서대로 모두 스캔하세요. 앱이 자동으로 모아서 불러옵니다."
        : "아이폰 카메라로 스캔하면 앱이 열리며 일정을 불러올 수 있습니다.");
}
document.getElementById("ex-qr").onclick=showQR;
document.getElementById("qr-prev").onclick=()=>{ if(qrIdx>0){qrIdx--;renderQR();} };
document.getElementById("qr-next").onclick=()=>{ if(qrIdx<qrChunks.length-1){qrIdx++;renderQR();} };
function handleQRHash(){
  const h=location.hash||"";
  if(h.indexOf("#q=")!==0) return false;
  let body=h.slice(3);
  try{ body=decodeURIComponent(body); }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  const m=/^([a-z0-9]{3})\.(\d+)\.(\d+)\.([A-Za-z0-9\-_]+)$/.exec(body);
  if(!m){ setTimeout(()=>toast("QR 데이터를 해석할 수 없습니다"),400); return true; }
  const id=m[1], idx=+m[2], total=+m[3];
  let buf=null;
  try{ buf=JSON.parse(localStorage.getItem("gantt.qrbuf")||"null"); }catch(e){}
  if(!buf||buf.id!==id||buf.total!==total) buf={id,total,parts:{}};
  buf.parts[idx]=m[4];
  const got=Object.keys(buf.parts).length;
  if(got<total){
    try{ localStorage.setItem("gantt.qrbuf",JSON.stringify(buf)); }catch(e){}
    setTimeout(()=>toast("QR "+got+"/"+total+" 수신 — 나머지 QR을 계속 스캔하세요"),400);
    return true;
  }
  try{ localStorage.removeItem("gantt.qrbuf"); }catch(e){}
  let all=""; for(let i=1;i<=total;i++) all+=buf.parts[i]||"";
  let text=null;
  try{ text=unb64u(all); }catch(e){}
  if(!text){ setTimeout(()=>toast("QR 데이터 복원에 실패했습니다. 처음부터 다시 스캔해 주세요"),400); return true; }
  pendingQR=text;
  return true;
}

/* ---- 주간 브리핑 ---- */
function fmtDW(d){ return shortD(fmtD(d))+"("+DOW[d.getDay()]+")"; }
function buildBrief(mode){
  const td=today0();
  let lo,hi,plo,phi,W,PW;
  if(mode==="month"){
    lo=new Date(td.getFullYear(),td.getMonth(),1);
    hi=new Date(td.getFullYear(),td.getMonth()+1,0);
    plo=new Date(td.getFullYear(),td.getMonth()-1,1);
    phi=new Date(td.getFullYear(),td.getMonth(),0);
    W="이번 달"; PW="지난달";
  }else{
    const dow=td.getDay();
    lo=addDays(td, dow===0?-6:1-dow); hi=addDays(lo,6);
    plo=addDays(lo,-7); phi=addDays(lo,-1);
    W="이번 주"; PW="지난주";
  }
  const due=[], prog=[], starting=[], lastDone=[], doneNow=[], reps=[], over=[];
  for(const t of state.tasks){
    if(t.repeat){
      const occ=occurrences(t,lo,hi);
      if(!occ.length) continue;
      if(mode==="month"){
        reps.push(t.name+(t.time?" ("+t.time+")":"")+" — "+occ.length+"회: "
          +occ.map(d=>shortD(fmtD(d))).join(", "));
      }else{
        for(const d of occ) reps.push(fmtDW(d)+(t.time?" "+t.time:"")+" — "+t.name);
      }
      continue;
    }
    const st=parseD(t.start), e=parseD(t.end), done=isDone(t);
    if(done){
      if(e>=lo&&e<=hi) doneNow.push(t.name+" (~"+fmtDW(e)+")");
      else if(e>=plo&&e<=phi) lastDone.push(t.name);
      continue;
    }
    if(e<lo) over.push(t.name+" (~"+fmtDW(e)+", "+daysBetween(e,td)+"일 초과)");
    else if(e<=hi) due.push(t.name+" (~"+fmtDW(e)+")"+(isUrgent(t)?" ⚠":""));
    else if(st<=hi) prog.push(t.name+" (~"+fmtDW(e)+")");
    if(st>=lo&&st<=hi) starting.push(t.name+" ("+fmtDW(st)+"~)");
  }
  const sec=(title,arr)=>{
    let h="<h3>"+title+"</h3>";
    h+=arr.length?"<ul>"+arr.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":'<div class="none">없음</div>';
    let x=title+"\n"+(arr.length?arr.map(v=>"- "+v).join("\n"):"- 없음");
    return {h,x};
  };
  const parts=[sec("✦ "+W+" 반복 일정",reps), sec("🔥 "+W+" 마감",due)];
  if(over.length) parts.push(sec("⚠ 기한 지남",over));
  parts.push(sec("▶ 진행 중",prog), sec("⏱ "+W+" 시작",starting),
             sec("✅ "+W+" 완료",doneNow), sec("✅ "+PW+" 완료(종료일 기준)",lastDone));
  const title=(mode==="month"?"월간":"주간")+" 브리핑";
  return {
    range:fmtDW(lo)+" ~ "+fmtDW(hi),
    html:parts.map(p=>p.h).join(""),
    text:title+" "+fmtDW(lo)+"~"+fmtDW(hi)+"\n\n"+parts.map(p=>p.x).join("\n\n")
  };
}

(function init(){

    document.getElementById("im-text").value=pendingQR; pendingQR=null;
    setTimeout(()=>toast("QR 수신 완료 — [불러오기]를 누르세요. 홈 화면 앱을 쓰신다면 이 텍스트를 복사해 가세요"),500);
  }
})();
</script>
