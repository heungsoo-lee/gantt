<title>프로젝트 일정 · 간트</title>
<style>
  :root{
    --paper:#F5F7FA; --surface:#FFFFFF; --ink:#1B2430; --muted:#64748B;
    --line:#E2E8F0; --line-strong:#CBD5E1; --accent:#0E7490; --today:#E4572E;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "Nanum Gothic Coding", monospace;
    --row-h: 42px; --left-w: 346px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden;
    padding-top:env(safe-area-inset-top)}

  /* ---------- top bar ---------- */
  header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);
    border-bottom:1px solid var(--line-strong);flex-wrap:wrap;flex:0 0 auto}
  header.top h1{font-size:15px;font-weight:650;letter-spacing:.2px;margin:0;white-space:nowrap}
  header.top h1 .dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);
    margin-right:8px;transform:translateY(-1px)}
  .spacer{flex:1}
  .group{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .group button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:13px;
    padding:7px 12px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
  .group button:last-child{border-right:0}
  .group button.on{background:var(--ink);color:#fff}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;
    font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.today{color:var(--today);border-color:#F0C4B6}
  .hide{display:none !important}

  .stage{flex:1;overflow:auto;background:var(--surface);-webkit-overflow-scrolling:touch}

  /* ---------- gantt ---------- */
  .grid{position:relative;min-width:max-content}
  .head{display:flex;position:sticky;top:0;z-index:20}
  .head .corner{position:sticky;left:0;z-index:30;width:var(--left-w);flex:0 0 var(--left-w);
    background:var(--surface);border-bottom:1px solid var(--line-strong);border-right:1px solid var(--line-strong);
    display:flex;align-items:flex-end}
  .resizer{position:absolute;top:0;right:-5px;width:11px;height:100%;cursor:col-resize;z-index:31;
    display:flex;align-items:center;justify-content:center;touch-action:none}
  .resizer::after{content:"";width:3px;height:20px;border-radius:2px;background:var(--line-strong)}
  .resizer:hover::after,.resizer.drag::after{background:var(--accent)}
  .corner .ch{display:flex;width:100%;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;
    letter-spacing:.4px;padding:0 10px 7px;gap:6px}
  .corner .ch .c-sw{width:20px}
  .corner .ch .c-name{flex:1}
  .corner .ch .c-date{width:74px;text-align:center}
  .corner .ch .c-prog{width:52px;text-align:right}
  .corner .ch .c-x{width:24px}

  .timeline-head{background:var(--surface);border-bottom:1px solid var(--line-strong)}

  .th-days{display:flex;height:22px}
  .th-day{border-right:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;

  .th-day.we{background:#F1F5F9}
  .th-day.tick{color:var(--ink)}

  .row{display:flex;height:var(--row-h);border-bottom:1px solid var(--line)}
  .row .r-left{position:sticky;left:0;z-index:10;width:var(--left-w);flex:0 0 var(--left-w);
    background:var(--surface);border-right:1px solid var(--line-strong);display:flex;align-items:center;
    padding:0 6px 0 10px;gap:6px}
  .row:hover .r-left{background:#FBFCFE}
  .r-left input{font:inherit;border:1px solid transparent;background:transparent;border-radius:5px;
    padding:4px 5px;color:var(--ink)}
  .r-left input:hover{border-color:var(--line)}
  .r-left input:focus{outline:none;border-color:var(--accent);background:#fff}
  .r-left .name{flex:1;min-width:0;font-size:13px}
  .r-left .date{width:74px;font-family:var(--mono);font-size:11px;text-align:center}
  .r-left .prog{width:52px;font-family:var(--mono);font-size:12px;text-align:right}
  .r-left .del{width:24px;flex:0 0 24px;border:0;background:transparent;color:var(--line-strong);
    cursor:pointer;font-size:16px;line-height:1;border-radius:5px}
  .r-left .del:hover{color:var(--today);background:#FDECE6}
  .sw{width:20px;height:20px;flex:0 0 20px;padding:0;border-radius:5px;
    border:1px solid rgba(0,0,0,.14);cursor:pointer}
  .sw:hover{box-shadow:0 0 0 2px rgba(14,116,144,.25)}
  .uico{color:#C0392B;font-size:13px;flex:0 0 auto;line-height:1}
  .flag{width:24px;flex:0 0 24px;border:0;background:transparent;color:var(--line-strong);
    cursor:pointer;font-size:14px;line-height:1;border-radius:5px;padding:0}
  .flag:hover{background:#F1F5F9;color:var(--muted)}
  .flag.on{color:#C0392B}
  .row.urgent .r-left{background:#FCF3F0}
  .row.urgent:hover .r-left{background:#FAECE7}
  .bar.urgent{box-shadow:inset 3px 0 0 #C0392B}
  .bar.done{opacity:.45}
  .row.done .name{text-decoration:line-through;color:var(--muted)}
  .cal-bar.urgent{box-shadow:inset 3px 0 0 #C0392B}
  .cal-bar.done{opacity:.45}
  .cal-bar.done span{text-decoration:line-through}
  .card.urgent{border-color:#E8B8AC;background:#FDF8F6}
  .card.done{opacity:.55}
  .card.done .name{text-decoration:line-through;color:var(--muted)}

  .r-time{position:relative;flex:0 0 auto}
  .r-time .cell{position:absolute;top:0;bottom:0;border-right:1px solid var(--line)}
  .r-time .cell.we{background:#F1F5F9}
  .bar{position:absolute;top:9px;height:24px;border-radius:5px;background:var(--barc);
    box-shadow:0 1px 0 rgba(0,0,0,.04);display:flex;align-items:center;overflow:hidden}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.22)}
  .bar .lbl{position:relative;font-size:11px;font-weight:600;padding:0 8px;white-space:nowrap}
  .today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:8;pointer-events:none}
  .today-flag{position:absolute;top:0;transform:translateX(-50%);background:var(--today);color:#fff;
    font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:0 0 5px 5px;white-space:nowrap;z-index:22}

  /* ---------- calendar ---------- */
  .cal{padding:0 0 40px}
  .cal-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 14px 8px;
    position:sticky;top:0;background:var(--surface);z-index:12}
  .cal-nav .mlabel{font-size:16px;font-weight:650;font-family:var(--mono);min-width:130px;text-align:center}
  .cal-nav button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
    width:34px;height:34px;font-size:16px;color:var(--ink);cursor:pointer;line-height:1}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line-strong);
    position:sticky;top:54px;background:var(--surface);z-index:12}
  .cal-dow div{text-align:center;font-size:11px;font-weight:650;color:var(--muted);padding:6px 0}
  .cal-dow div:first-child{color:#DC2626}
  .cal-dow div:last-child{color:#2563EB}
  .cal-week{position:relative;border-bottom:1px solid var(--line)}
  .cal-cells{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-cell{min-height:var(--wk-h);border-right:1px solid var(--line);padding:4px 0 0;position:relative}
  .cal-cell:last-child{border-right:0}
  .cal-cell.we{background:#F8FAFC}
  .cal-cell .dnum{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;line-height:20px}
  .cal-cell.out .dnum{opacity:.32}
  .cal-cell.tdy .dnum{background:var(--today);color:#fff;border-radius:50%;width:20px;height:20px;
    margin:0 auto;font-weight:700}
  .cal-cell .more{position:absolute;left:2px;right:2px;bottom:3px;border:0;background:#EEF2F7;
    color:var(--muted);font:inherit;font-size:10px;font-weight:650;padding:2px 0;border-radius:4px;
    cursor:pointer;text-align:center;z-index:3}
  .cal-cell .more:hover{background:#E2E8F0;color:var(--ink)}
  .wk-collapse{position:absolute;right:4px;bottom:3px;width:46px;border:0;background:#EEF2F7;
    color:var(--muted);font:inherit;font-size:10px;font-weight:650;padding:2px 0;border-radius:4px;
    cursor:pointer;z-index:4}
  .wk-collapse:hover{background:#E2E8F0;color:var(--ink)}
  .cal-bars{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
  .cal-bar{position:absolute;height:18px;background:var(--barc);border-radius:4px;display:flex;
    align-items:center;overflow:hidden;pointer-events:auto;cursor:pointer}
  .cal-bar.cutL{border-top-left-radius:0;border-bottom-left-radius:0}
  .cal-bar.cutR{border-top-right-radius:0;border-bottom-right-radius:0}
  .cal-bar span{font-size:10.5px;font-weight:600;padding:0 6px;white-space:nowrap}

  /* ---------- list ---------- */
  .list{padding:10px 12px 60px;max-width:620px;margin:0 auto}
  .card{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;background:var(--surface)}
  .card.flash{animation:flash 1.4s ease}
  @keyframes flash{0%,60%{background:#ECFEFF;border-color:var(--accent)}100%{background:var(--surface)}}
  .card .c1{display:flex;align-items:center;gap:9px}
  .card .name{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:600;border:1px solid transparent;
    background:transparent;border-radius:6px;padding:5px 6px;color:var(--ink)}
  .card .name:focus{outline:none;border-color:var(--accent)}
  .card .del{border:0;background:transparent;color:var(--line-strong);font-size:19px;cursor:pointer;padding:2px 6px}
  .card .c2{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
  .card .c2 input{font:inherit;font-family:var(--mono);font-size:12px;border:1px solid var(--line-strong);
    border-radius:7px;padding:6px 7px;color:var(--ink);background:var(--paper)}
  .card .c2 .date{flex:1;min-width:120px;text-align:center}
  .card .c2 .prog{width:62px;text-align:right}
  .card .c2 .arw{color:var(--muted);font-size:12px}
  .card .track{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
  .card .track i{display:block;height:100%;background:var(--barc);border-radius:3px}
  .card .meta{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:7px}

  .empty{padding:44px 24px;color:var(--muted);font-size:14px;text-align:center}

  /* ---------- color popover ---------- */
  .popover{position:fixed;z-index:70;width:196px;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:10px;padding:11px;box-shadow:0 10px 28px rgba(15,23,42,.18)}
  .sw-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .sw-opt{width:100%;aspect-ratio:1/1;padding:0;border-radius:5px;border:1px solid rgba(0,0,0,.14);cursor:pointer}
  .sw-opt.on{box-shadow:0 0 0 2px var(--ink)}
  .sw-custom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;
    font-size:12px;color:var(--muted)}
  .sw-custom input{width:44px;height:28px;padding:2px;border:1px solid var(--line-strong);
    border-radius:6px;background:none}

  /* ---------- sync sheet ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.32);z-index:50;display:none}
  .backdrop.open{display:block}
  .sheet{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:51;
    transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;
    border-left:1px solid var(--line-strong);padding-top:env(safe-area-inset-top)}
  .sheet.open{transform:none}
  .sheet .sh-top{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .sheet .sh-top h2{font-size:14px;margin:0}
  .sheet .body-s{padding:16px;overflow:auto;flex:1}
  .sheet h3{font-size:13px;margin:0 0 6px;letter-spacing:.2px}
  .sheet p.hint{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.55}
  .sheet textarea{width:100%;min-height:100px;font-family:var(--mono);font-size:11px;
    border:1px solid var(--line-strong);border-radius:8px;padding:9px;resize:vertical;color:var(--ink);background:var(--paper)}
  .sheet .rowbtn{display:flex;gap:8px;margin:8px 0 22px}
  .sheet .sep{height:1px;background:var(--line);margin:4px 0 18px}
  .x{border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;z-index:60;
    transition:all .2s;pointer-events:none;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* ---------- narrow screens ---------- */
  @media (max-width:700px){
    :root{--left-w:158px}
    header.top{gap:8px;padding:9px 11px}
    header.top h1{font-size:14px}
    .group button,.btn{padding:7px 10px;font-size:12.5px}
    .r-left .date,.r-left .prog,.corner .ch .c-date,.corner .ch .c-prog{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
  <header class="top">
    <h1><span class="dot"></span>일정</h1>
    <div class="spacer"></div>
    <div class="group" id="view">
      <button data-v="gantt">간트</button>
      <button data-v="cal">캘린더</button>
      <button data-v="list">목록</button>
    </div>
    <div class="group" id="zoom">
      <button data-z="day">일</button>
      <button data-z="week">주</button>
      <button data-z="month">월</button>
    </div>
    <button class="btn today" id="btn-today">오늘</button>
    <button class="btn" id="btn-all">모두 표시</button>
    <button class="btn" id="btn-done">완료 숨기기</button>
    <button class="btn" id="btn-add">+ 작업</button>
    <button class="btn primary" id="btn-sync">동기화</button>
  </header>

  <div class="stage" id="stage"></div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="sheet" id="sheet">
    <div class="sh-top"><h2>동기화</h2><div class="spacer"></div><button class="x" id="sheet-close">×</button></div>
    <div class="body-s">
      <h3>1 · 내보내기</h3>
      <p class="hint">현재 일정입니다. 한 줄이 작업 하나이며, 직접 읽고 고칠 수도 있습니다. [복사] 후 다른 애플 기기에 바로 붙여넣거나(범용 클립보드), 사내 웹메일로 자신에게 보내세요.</p>
      <textarea id="ex-text" onclick="this.select()" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      <div class="rowbtn"><button class="btn primary" id="ex-copy">텍스트 복사</button></div>
      <div class="sep"></div>
      <h3>2 · 불러오기</h3>
      <p class="hint">받은 텍스트를 붙여넣고 [불러오기]를 누르면 이 기기의 일정을 그것으로 대체합니다. 앞뒤에 메일 서명 등이 섞여 있어도 일정 줄만 골라냅니다.</p>
      <textarea id="im-text" placeholder="여기에 붙여넣기…" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      <div class="rowbtn"><button class="btn primary" id="im-load">불러오기</button></div>
    </div>
  </aside>
  <div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================
   일정 · 간트 / 캘린더 / 목록   (단일 파일 · 외부 의존성 없음)
   ========================================================== */
const DAY=86400000;
const MONTHS=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const DOW=["일","월","화","수","목","금","토"];
const BARC=["#BC4A3C","#C7871B","#4E8A3C","#0F8A6E","#1C7C99","#2F63B4","#7A54C0","#B0468F","#5B6B7B","#8A5A44"];
const SWATCHES=["#BC4A3C","#C7871B","#4E8A3C","#0F8A6E","#1C7C99","#2F63B4","#7A54C0","#B0468F","#5B6B7B","#8A5A44"];
const ZOOM={day:{w:30,pad:3},week:{w:11,pad:7},month:{w:4.2,pad:16}};
const CAL_LANES=5, LANE_H=20, LANE_TOP=24;

let state={view:"gantt",zoom:"week",tasks:[],cal:null,calAll:false,leftW:346,hideDone:false};
const openWeeks=new Set();
let flashId=null;

/* ---- dates (local, no TZ drift) ---- */
function parseD(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function fmtD(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function shortD(s){const[,m,d]=s.split("-");return +m+"/"+ +d;}
function today0(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function daysBetween(a,b){return Math.round((b-a)/DAY);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---- storage ---- */
const KEY="gantt.v1";
function save(){try{localStorage.setItem(KEY,JSON.stringify({view:state.view,zoom:state.zoom,calAll:state.calAll,leftW:state.leftW,hideDone:state.hideDone,tasks:state.tasks}));}catch(e){}}
function loadLocal(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}

/* ---- encode / decode ----
   내보내기: 사람이 읽는 줄 단위 텍스트 (한 줄이 깨져도 나머지는 살아남음)
   불러오기: 새 텍스트 형식 + 예전 GANTT1 형식 + 순수 JSON 모두 허용 */
function pad2(n){return String(n).padStart(2,"0");}
function normD(s){
  const m=/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})$/.exec(String(s).trim());
  return m?m[1]+"-"+pad2(+m[2])+"-"+pad2(+m[3]):null;
}
function enc(o){
  const lines=["# 일정 데이터 · 이 줄 아래를 모두 복사해서 옮기세요",
               "# 작업명 | 시작 | 종료 | 진행% | 색상 | 긴급(!)"];
  for(const t of o.tasks){
    lines.push([String(t.name||"").replace(/\|/g,"/").trim()||"이름 없음",
                t.start, t.end, (Math.max(0,Math.min(100,+t.progress||0)))+"%",
                t.color||"", t.urgent?"!":""].join(" | ").replace(/(\s*\|\s*)+$/,""));
  }
  return lines.join("\n");
}
function decLines(text){
  const out=[];
  for(const raw of String(text).split(/\r?\n/)){
    const line=raw.trim();
    if(!line||line.startsWith("#")) continue;
    const f=line.split("|").map(x=>x.trim());
    if(f.length<3) continue;
    const s=normD(f[1]), e=normD(f[2]);
    if(!s||!e) continue;
    const t={id:uid(),name:f[0]||"이름 없음",start:s,end:e,
             progress:Math.max(0,Math.min(100,parseInt(f[3],10)||0))};
    const col=(f[4]||"").trim();
    if(/^#[0-9a-fA-F]{6}$/.test(col)) t.color=col;
    if((f[5]||"").trim()==="!") t.urgent=true;
    if(parseD(t.end)<parseD(t.start)) t.end=t.start;
    out.push(t);
  }
  return out;
}
function dec(text){
  const raw=String(text||"");
  const lines=decLines(raw);
  if(lines.length) return lines;                       // 새 텍스트 형식
  let t=raw.trim();
  const h=t.indexOf("#d="); if(h>=0)t=t.slice(h+3);
  if(t.startsWith("GANTT1:"))t=t.slice(7);
  t=t.replace(/[^A-Za-z0-9+/=]/g,"");                  // 예전 Base64 형식(오염 문자 제거)
  if(t){
    try{const o=JSON.parse(decodeURIComponent(escape(atob(t))));
      if(Array.isArray(o.tasks))return o.tasks;}catch(e){}
  }
  try{const o=JSON.parse(raw);                          // 순수 JSON
    if(Array.isArray(o.tasks))return o.tasks; if(Array.isArray(o))return o;}catch(e){}
  return null;
}

let _n=0; function uid(){return "t"+Date.now().toString(36)+(_n++);}
function colorOf(t,i){return t.color||BARC[i%BARC.length];}
function isDone(t){return (+t.progress||0)>=100;}
function isUrgent(t){ // 수동 플래그 또는 자동 규칙(미완료 + 종료일 3일 이내/초과)
  if(isDone(t)) return false;
  if(t.urgent) return true;
  return daysBetween(today0(),parseD(t.end))<=3;
}
function inkOn(hex){ // 막대 색 밝기에 따라 흰/검정 글씨 선택
  const h=hex.replace("#",""); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  const lin=c=>{c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
  const L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
  return (1.05/(L+0.05) >= (L+0.05)/0.05) ? "#fff" : "#141414";
}
function sample(){const b=today0();
  const mk=(n,s,l,p)=>({id:uid(),name:n,start:fmtD(addDays(b,s)),end:fmtD(addDays(b,s+l)),progress:p});
  return [mk("문헌 조사",-7,6,100),mk("모델 개발",0,13,45),mk("시험·검증",10,9,0),mk("보고서 작성",18,7,0)];}

/* ================= dispatcher ================= */
function render(){
  closePop();
  document.documentElement.style.setProperty("--left-w",(state.leftW||346)+"px");
  document.getElementById("zoom").classList.toggle("hide",state.view!=="gantt");
  const ba=document.getElementById("btn-all");
  ba.classList.toggle("hide",state.view!=="cal");
  ba.textContent=state.calAll?"간략히":"모두 표시";
  ba.classList.toggle("primary",state.calAll);
  const bd=document.getElementById("btn-done");
  bd.textContent=state.hideDone?"완료 표시":"완료 숨기기";
  bd.classList.toggle("primary",state.hideDone);
  document.querySelectorAll("#view button").forEach(b=>b.classList.toggle("on",b.dataset.v===state.view));
  document.querySelectorAll("#zoom button").forEach(b=>b.classList.toggle("on",b.dataset.z===state.zoom));
  const st=document.getElementById("stage");
  if(state.view==="gantt") st.innerHTML=viewGantt();
  else if(state.view==="cal") st.innerHTML=viewCal();
  else st.innerHTML=viewList();
  if(flashId){const el=document.querySelector('.card[data-tid="'+flashId+'"]');
    if(el){el.classList.add("flash");el.scrollIntoView({block:"center",behavior:"smooth"});}
    flashId=null;}
  save();
}

/* ================= gantt ================= */
function range(){
  const z=ZOOM[state.zoom]; let lo,hi;
  for(const t of state.tasks){const s=parseD(t.start),e=parseD(t.end);
    if(!lo||s<lo)lo=s; if(!hi||e>hi)hi=e;}
  if(!lo){const t=today0();lo=addDays(t,-7);hi=addDays(t,21);}
  const td=today0(); if(td<lo)lo=td; if(td>hi)hi=td;
  return {start:addDays(lo,-z.pad),end:addDays(hi,z.pad)};
}
function viewGantt(){
  if(!state.tasks.length) return '<div class="empty">작업이 없습니다. 상단의 <b>+ 작업</b>으로 시작하세요.</div>';
  const W=ZOOM[state.zoom].w, {start,end}=range();
  const total=daysBetween(start,end)+1, tlw=Math.round(total*W);
  let months="",days="",m=-1,ms=0;
  const showNum=state.zoom!=="month";
  let weCells="";
  for(let i=0;i<total;i++){
    const dt=addDays(start,i),dow=dt.getDay(),we=(dow===0||dow===6);
    if(dt.getMonth()!==m){ if(m>=0)months+='<div class="th-month" style="width:'+((i-ms)*W)+'px">'+MONTHS[m]+'</div>';
      m=dt.getMonth();ms=i;}
    let cls="th-day"+(we?" we":""),txt="";
    if(showNum){ if(state.zoom==="day"){txt=dt.getDate(); if(dt.getDate()===1||dow===1)cls+=" tick";}
      else if(dow===1){txt=dt.getDate();cls+=" tick";} }
    days+='<div class="'+cls+'" style="width:'+W+'px">'+txt+'</div>';
    if(we&&state.zoom!=="month") weCells+='<div class="cell we" style="left:'+(i*W)+'px;width:'+W+'px"></div>';
  }
  months+='<div class="th-month" style="width:'+((total-ms)*W)+'px">'+MONTHS[m]+'</div>';
  const td=today0(), tdX=(daysBetween(start,td)+0.5)*W;

  let rows="";
  state.tasks.forEach((t,i)=>{
    if(state.hideDone&&isDone(t)) return;
    const s=parseD(t.start),e=parseD(t.end);
    const left=daysBetween(start,s)*W, w=Math.max((daysBetween(s,e)+1)*W,6);
    const c=colorOf(t,i), pg=Math.max(0,Math.min(100,+t.progress||0));
    const urg=isUrgent(t), done=isDone(t);
    rows+='<div class="row'+(urg?" urgent":"")+(done?" done":"")+'" data-i="'+i+'">'
      +'<div class="r-left">'
        +'<button class="sw" title="색상" style="background:'+c+'"></button>'
        +(urg?'<span class="uico" title="긴급">⚠</span>':'')
        +'<input class="name" value="'+esc(t.name)+'" data-k="name" placeholder="작업명">'
        +'<input class="date" type="date" value="'+t.start+'" data-k="start">'
        +'<input class="date" type="date" value="'+t.end+'" data-k="end">'
        +'<input class="prog" type="number" min="0" max="100" value="'+pg+'" data-k="progress">'
        +'<button class="flag'+(t.urgent?" on":"")+'" title="긴급 표시">⚑</button>'
        +'<button class="del" title="삭제">×</button>'
      +'</div>'
      +'<div class="r-time" style="width:'+tlw+'px">'+weCells
        +'<div class="bar'+(urg?" urgent":"")+(done?" done":"")+'" style="left:'+left+'px;width:'+w+'px;--barc:'+c+'">'
        +'<div class="fill" style="width:'+pg+'%"></div><span class="lbl" style="color:'+inkOn(c)+'">'+(done?"✓":pg+"%")+'</span></div>'
      +'</div></div>';
  });
  return '<div class="grid"><div class="head">'
    +'<div class="corner"><div class="ch"><span class="c-sw"></span><span class="c-name">작업명</span>'
    +'<span class="c-date">시작</span><span class="c-date">종료</span><span class="c-prog">진행</span><span class="c-x"></span></div><div class="resizer" id="resizer" title="드래그하여 너비 조절"></div></div>'
    +'<div class="timeline-head" style="width:'+tlw+'px">'
      +'<div style="position:relative;height:0"><div class="today-flag" style="left:'+tdX+'px">오늘 '+shortD(fmtD(td))+'</div></div>'
      +'<div class="th-months">'+months+'</div><div class="th-days">'+days+'</div></div></div>'
    +'<div class="body" style="position:relative">'+rows
      +'<div class="today-line" style="left:calc(var(--left-w) + '+tdX+'px)"></div></div></div>';
}

/* ================= calendar ================= */
function calBase(){ if(!state.cal){const t=today0();state.cal=new Date(t.getFullYear(),t.getMonth(),1);} return state.cal; }
function viewCal(){
  const base=calBase(), y=base.getFullYear(), mo=base.getMonth();
  const first=new Date(y,mo,1), last=new Date(y,mo+1,0);
  const gridStart=addDays(first,-first.getDay());
  const weeks=Math.ceil((last.getDay()===6?daysBetween(gridStart,last)+1:daysBetween(gridStart,last)+(7-last.getDay()))/7);
  const td=today0();

  const segs=state.tasks.map((t,i)=>({i,t,s:parseD(t.start),e:parseD(t.end),c:colorOf(t,i)}))
    .filter(g=>!(state.hideDone&&isDone(g.t)))
    .sort((a,b)=>a.s-b.s || (b.e-b.s)-(a.e-a.s));

  // ---- fit the whole month into the visible area ----
  const stageEl=document.getElementById("stage");
  const availH=(stageEl?stageEl.clientHeight:window.innerHeight-120);
  const HEADS=54+29;                     // cal-nav + weekday row
  const MINWK=60;                        // never thinner than this (then it scrolls)
  const wkH=Math.max(MINWK, Math.floor((availH-HEADS-2)/weeks));
  const laneFit=Math.max(1, Math.floor((wkH-LANE_TOP-4)/LANE_H));  // lanes that fit in a week

  let html='<div class="cal"><div class="cal-nav">'
    +'<button id="cal-prev">‹</button><span class="mlabel">'+y+'년 '+MONTHS[mo]+'</span><button id="cal-next">›</button></div>'
    +'<div class="cal-dow">'+DOW.map(d=>'<div>'+d+'</div>').join("")+'</div>';

  for(let w=0;w<weeks;w++){
    const ws=addDays(gridStart,w*7), we=addDays(ws,6), wkey=fmtD(ws);
    // 1) place every overlapping task into a lane
    const lanes=[], placed=[];
    for(const g of segs){
      if(g.e<ws||g.s>we) continue;
      const s=g.s<ws?ws:g.s, e=g.e>we?we:g.e;
      const a=daysBetween(ws,s), b=daysBetween(ws,e);
      let lane=0; while(lanes[lane]&&lanes[lane].some(r=>!(b<r[0]||a>r[1]))) lane++;
      (lanes[lane]=lanes[lane]||[]).push([a,b]);
      placed.push({g,a,b,lane});
    }
    // 2) cap lanes to what fits (unless this week is expanded)
    const expanded=state.calAll||openWeeks.has(wkey);
    const needMore=lanes.length>laneFit;
    const cap=expanded?Infinity:(needMore?Math.max(1,laneFit-1):laneFit); // reserve a row for +N
    let bars="", overflow={};
    for(const p of placed){
      if(p.lane>=cap){ for(let d=p.a;d<=p.b;d++) overflow[d]=(overflow[d]||0)+1; continue; }
      const urg=isUrgent(p.g.t), done=isDone(p.g.t);
      bars+='<div class="cal-bar'+(p.g.s<ws?" cutL":"")+(p.g.e>we?" cutR":"")+(urg?" urgent":"")+(done?" done":"")+'" data-tid="'+p.g.t.id+'" '
        +'style="left:calc('+(p.a/7*100)+'% + 2px);width:calc('+((p.b-p.a+1)/7*100)+'% - 4px);'
        +'top:'+(LANE_TOP+p.lane*LANE_H)+'px;--barc:'+p.g.c+'"><span style="color:'+inkOn(p.g.c)+'">'+(urg?"⚠ ":"")+esc(p.g.t.name)+'</span></div>';
    }
    const hasMore=Object.keys(overflow).length>0;
    // fixed height so the month always fills the screen; expanded busy weeks may grow & scroll
    const h=expanded?Math.max(wkH,LANE_TOP+lanes.length*LANE_H+18):wkH;
    let cells="";
    for(let d=0;d<7;d++){
      const dt=addDays(ws,d), out=dt.getMonth()!==mo, we2=(d===0||d===6);
      cells+='<div class="cal-cell'+(we2?" we":"")+(out?" out":"")+(dt.getTime()===td.getTime()?" tdy":"")+'">'
        +'<div class="dnum">'+dt.getDate()+'</div>'
        +(overflow[d]?'<button class="more" data-wk="'+wkey+'">+'+overflow[d]+'</button>':'')
        +'</div>';
    }
    html+='<div class="cal-week" style="--wk-h:'+h+'px"><div class="cal-cells">'+cells+'</div>'
      +'<div class="cal-bars">'+bars+'</div>'
      +(expanded&&needMore?'<button class="wk-collapse" data-wk="'+wkey+'">접기</button>':'')
      +'</div>';
  }
  return html+'</div>';
}

/* ================= list ================= */
function viewList(){
  if(!state.tasks.length) return '<div class="empty">작업이 없습니다. 상단의 <b>+ 작업</b>으로 시작하세요.</div>';
  const td=today0();
  const order=state.tasks.map((t,i)=>({t,i})).sort((a,b)=>parseD(a.t.start)-parseD(b.t.start));
  let out='<div class="list">';
  for(const {t,i} of order){
    if(state.hideDone&&isDone(t)) continue;
    const c=colorOf(t,i), pg=Math.max(0,Math.min(100,+t.progress||0));
    const s=parseD(t.start), e=parseD(t.end), len=daysBetween(s,e)+1;
    const urg=isUrgent(t), done=isDone(t);
    let meta;
    if(done) meta="완료 ✓ · 총 "+len+"일";
    else if(td<s) meta="시작까지 "+daysBetween(td,s)+"일 · 총 "+len+"일";
    else if(td>e) meta="기한 지남 · "+daysBetween(e,td)+"일 초과";
    else meta="진행 중 · 종료까지 "+daysBetween(td,e)+"일";
    out+='<div class="card'+(urg?" urgent":"")+(done?" done":"")+'" data-i="'+i+'" data-tid="'+t.id+'">'
      +'<div class="c1"><button class="sw" title="색상" style="background:'+c+'"></button>'
        +(urg?'<span class="uico" title="긴급">⚠</span>':'')
        +'<input class="name" value="'+esc(t.name)+'" data-k="name" placeholder="작업명">'
        +'<button class="flag'+(t.urgent?" on":"")+'" title="긴급 표시">⚑</button>'
        +'<button class="del" title="삭제">×</button></div>'
      +'<div class="c2"><input class="date" type="date" value="'+t.start+'" data-k="start">'
        +'<span class="arw">→</span><input class="date" type="date" value="'+t.end+'" data-k="end">'
        +'<input class="prog" type="number" min="0" max="100" value="'+pg+'" data-k="progress">%</div>'
      +'<div class="track"><i style="width:'+pg+'%;--barc:'+c+';background:'+c+'"></i></div>'
      +'<div class="meta">'+meta+'</div></div>';
  }
  return out+'</div>';
}

/* ================= events ================= */
const stage=document.getElementById("stage");

stage.addEventListener("input",e=>{
  const inp=e.target.closest("input[data-k]"); if(!inp) return;
  const host=inp.closest("[data-i]"); if(!host) return;
  const t=state.tasks[+host.dataset.i], k=inp.dataset.k;
  if(k==="name"){t.name=inp.value;save();return;}
  if(k==="progress"){
    const was=isDone(t), wasU=isUrgent(t);
    const v=Math.max(0,Math.min(100,+inp.value||0)); t.progress=v;
    const bar=host.querySelector(".bar");
    if(bar){bar.querySelector(".fill").style.width=v+"%";bar.querySelector(".lbl").textContent=(v>=100?"✓":v+"%");}
    const tr=host.querySelector(".track i"); if(tr)tr.style.width=v+"%";
    save();
    if(was!==isDone(t)||wasU!==isUrgent(t)) render();
    return;
  }
});
stage.addEventListener("change",e=>{
  const inp=e.target.closest("input[data-k]"); if(!inp) return;
  const host=inp.closest("[data-i]"); if(!host) return;
  const t=state.tasks[+host.dataset.i], k=inp.dataset.k;
  if(k==="start"||k==="end"){
    if(!inp.value) return;
    t[k]=inp.value;
    if(parseD(t.end)<parseD(t.start)){ if(k==="start")t.end=t.start; else t.start=t.end; }
    render();
  }
});
stage.addEventListener("click",e=>{
  const sw=e.target.closest(".sw");
  if(sw){ openPop(sw,+sw.closest("[data-i]").dataset.i); return; }
  const fl=e.target.closest(".flag");
  if(fl){ const t=state.tasks[+fl.closest("[data-i]").dataset.i]; t.urgent=!t.urgent; render(); return; }
  const del=e.target.closest(".del");
  if(del){ state.tasks.splice(+del.closest("[data-i]").dataset.i,1); render(); return; }
  const cb=e.target.closest(".cal-bar");
  if(cb){ flashId=cb.dataset.tid; state.view="list"; render(); return; }
  const more=e.target.closest(".more,.wk-collapse");
  if(more){
    const k=more.dataset.wk;
    if(openWeeks.has(k)) openWeeks.delete(k); else openWeeks.add(k);
    render(); return;
  }
  if(e.target.id==="cal-prev"){ state.cal=new Date(calBase().getFullYear(),calBase().getMonth()-1,1); render(); return; }
  if(e.target.id==="cal-next"){ state.cal=new Date(calBase().getFullYear(),calBase().getMonth()+1,1); render(); return; }
});

/* ---- color popover ---- */
let pop=null;
function closePop(){ if(pop){pop.remove();pop=null;} }
document.addEventListener("click",e=>{
  if(pop&&!e.target.closest(".popover")&&!e.target.closest(".sw")) closePop();
});
function openPop(anchor,idx){
  closePop();
  const t=state.tasks[idx], cur=colorOf(t,idx).toLowerCase();
  pop=document.createElement("div"); pop.className="popover";
  pop.innerHTML='<div class="sw-grid">'+SWATCHES.map(c=>
      '<button class="sw-opt'+(c.toLowerCase()===cur?" on":"")+'" data-c="'+c+'" style="background:'+c+'"></button>').join("")
    +'</div><label class="sw-custom">직접 선택 <input type="color" value="'+cur+'"></label>';
  document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect(), ph=pop.offsetHeight||150;
  pop.style.left=Math.min(Math.max(8,r.left-4),window.innerWidth-204)+"px";
  pop.style.top=(r.bottom+ph+8>window.innerHeight?Math.max(8,r.top-ph-8):r.bottom+6)+"px";
  pop.addEventListener("click",ev=>{
    const b=ev.target.closest(".sw-opt"); if(!b)return;
    t.color=b.dataset.c; closePop(); render();
  });
  pop.querySelector('input[type="color"]').addEventListener("input",ev=>{
    t.color=ev.target.value; applyColor(idx,t.color); save();
  });
}
function applyColor(i,c){
  const host=document.querySelector('[data-i="'+i+'"]'); if(!host)return;
  const bar=host.querySelector(".bar"); if(bar)bar.style.setProperty("--barc",c);
  const tr=host.querySelector(".track i"); if(tr)tr.style.background=c;
  const sw=host.querySelector(".sw"); if(sw)sw.style.background=c;
}

/* ---- resize left panel (drag), persisted ---- */
(function(){
  let dragging=false, startX=0, startW=0;
  const MIN=120, MAX=680;
  function down(e){
    const h=e.target.closest("#resizer"); if(!h) return;
    dragging=true; h.classList.add("drag");
    startX=(e.touches?e.touches[0].clientX:e.clientX); startW=state.leftW||346;
    e.preventDefault();
  }
  function move(e){
    if(!dragging) return;
    const x=(e.touches?e.touches[0].clientX:e.clientX);
    const w=Math.max(MIN,Math.min(MAX,startW+(x-startX)));
    state.leftW=Math.round(w);
    document.documentElement.style.setProperty("--left-w",state.leftW+"px");
  }
  function up(){
    if(!dragging) return;
    dragging=false;
    const h=document.getElementById("resizer"); if(h)h.classList.remove("drag");
    save();
  }
  stage.addEventListener("mousedown",down);
  stage.addEventListener("touchstart",down,{passive:false});
  window.addEventListener("mousemove",move);
  window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up);
  window.addEventListener("touchend",up);
})();

/* ---- toolbar ---- */
document.getElementById("view").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]"); if(!b)return;
  state.view=b.dataset.v; render();
  if(state.view==="gantt") scrollToToday();
});
document.getElementById("zoom").addEventListener("click",e=>{
  const b=e.target.closest("button[data-z]"); if(!b)return;
  state.zoom=b.dataset.z; render(); scrollToToday();
});
document.getElementById("btn-add").onclick=()=>{
  const b=today0();
  state.tasks.push({id:uid(),name:"새 작업",start:fmtD(b),end:fmtD(addDays(b,4)),progress:0});
  if(state.view==="cal"){ flashId=state.tasks[state.tasks.length-1].id; state.view="list"; }
  render();
  const n=document.querySelectorAll(".name"); if(n.length) n[n.length-1].focus();
};
document.getElementById("btn-all").onclick=()=>{
  state.calAll=!state.calAll; openWeeks.clear(); render();
};
document.getElementById("btn-done").onclick=()=>{
  state.hideDone=!state.hideDone; render();
};
document.getElementById("btn-today").onclick=()=>{
  if(state.view==="cal"){ const t=today0(); state.cal=new Date(t.getFullYear(),t.getMonth(),1); render(); }
  else if(state.view==="gantt") scrollToToday();
  else stage.scrollTo({top:0,behavior:"smooth"});
};
function scrollToToday(){
  if(state.view!=="gantt")return;
  const {start}=range(), W=ZOOM[state.zoom].w;
  const x=daysBetween(start,today0())*W;
  stage.scrollTo({left:Math.max(0,x-stage.clientWidth/2),behavior:"smooth"});
}

/* ---- sync sheet ---- */
const sheet=document.getElementById("sheet"), backdrop=document.getElementById("backdrop");
document.getElementById("btn-sync").onclick=()=>{
  document.getElementById("ex-text").value=enc(state);
  sheet.classList.add("open"); backdrop.classList.add("open");
};
function closeSheet(){sheet.classList.remove("open");backdrop.classList.remove("open");}
document.getElementById("sheet-close").onclick=closeSheet;
backdrop.onclick=closeSheet;
function copyText(text,msg){
  const done=()=>toast(msg);
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));
    else fallbackCopy(text,done);
  }catch(e){fallbackCopy(text,done);}
}
function fallbackCopy(text,done){
  const ta=document.getElementById("ex-text");
  ta.value=text; ta.focus(); ta.select();
  try{ ta.setSelectionRange(0,text.length); }catch(e){}
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  if(ok) done();
  else toast("자동 복사가 막혀 있습니다. 위 칸을 길게 눌러 전체 선택 후 복사하세요");
}
document.getElementById("ex-copy").onclick=()=>copyText(enc(state),"일정 텍스트를 복사했습니다");
document.getElementById("im-load").onclick=()=>{
  const src=document.getElementById("im-text").value;
  if(!src.trim()){ toast("불러올 텍스트를 먼저 붙여넣으세요"); return; }
  const tasks=dec(src);
  if(!tasks||!tasks.length){
    toast("작업을 찾지 못했습니다. '작업명 | 시작일 | 종료일' 형식인지 확인하세요"); return;
  }
  tasks.forEach(t=>{if(!t.id)t.id=uid();if(t.progress==null)t.progress=0;});
  state.tasks=tasks; render(); closeSheet();
  toast(tasks.length+"개 작업을 불러왔습니다");
};
let tT; function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");
  clearTimeout(tT);tT=setTimeout(()=>el.classList.remove("show"),1900);}

/* re-fit calendar when the window size / orientation changes */
let rzT;
window.addEventListener("resize",()=>{
  if(state.view!=="cal") return;
  clearTimeout(rzT); rzT=setTimeout(()=>{ if(state.view==="cal") render(); },150);
});

/* ================= boot ================= */
(function init(){
  let loaded=null;
  try{ if(location.hash.indexOf("#d=")===0) loaded=dec(location.hash); }catch(e){}
  const l=loadLocal();
  if(loaded) state.tasks=loaded;
  else if(l&&Array.isArray(l.tasks)){ state.tasks=l.tasks; if(ZOOM[l.zoom])state.zoom=l.zoom; if(l.view)state.view=l.view; state.calAll=!!l.calAll; if(l.leftW)state.leftW=l.leftW; state.hideDone=!!l.hideDone; }
  else { state.tasks=sample(); state.view=null; }
  if(!state.view) state.view=(window.innerWidth<700?"cal":"gantt");
  state.tasks.forEach(t=>{if(!t.id)t.id=uid();if(t.progress==null)t.progress=0;});
  render(); scrollToToday();
})();
</script>
